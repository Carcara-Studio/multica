name: HIER-005 Diagnostic

on:
  push:
    branches:
      - feat/HIER-005-project-hierarchy-ui
  workflow_dispatch:

concurrency:
  group: hier-005-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard-one-captured:
    name: views shard 1/2 captured
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run shard and print only failure tail
        shell: bash
        run: |
          set +e
          pnpm --filter='@multica/views' exec vitest run --shard=1/2 --reporter=verbose > /tmp/views-shard-1.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo '--- BEGIN VITEST FAILURE TAIL ---'
            tail -n 220 /tmp/views-shard-1.log
            echo '--- END VITEST FAILURE TAIL ---'
            exit "$status"
          fi

          echo 'views shard 1/2 passed'
