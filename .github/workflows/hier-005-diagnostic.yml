name: HIER-005 Diagnostic

on:
  push:
    branches:
      - feat/HIER-005-project-hierarchy-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hier-005-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-plurals-and-verify:
    name: normalize locale plurals and verify views shard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Remove dead singular plural keys
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          for locale in ("ja", "ko", "zh-Hans"):
              path = Path(f"packages/views/locales/{locale}/projects.json")
              data = json.loads(path.read_text(encoding="utf-8"))
              hierarchy = data.get("hierarchy")
              if not isinstance(hierarchy, dict):
                  raise SystemExit(f"missing hierarchy object for {locale}")
              hierarchy.pop("member_count_one", None)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Commit plural fix when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No plural fix changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packages/views/locales/ja/projects.json \
                    packages/views/locales/ko/projects.json \
                    packages/views/locales/zh-Hans/projects.json
            git commit -m 'HIER-005: align locale plural categories'
            git push origin HEAD:feat/HIER-005-project-hierarchy-ui
          fi

      - name: Verify locale parity
        run: pnpm --filter='@multica/views' exec vitest run locales/parity.test.ts

      - name: Verify ProjectDetail regressions
        run: pnpm --filter='@multica/views' exec vitest run projects/components/project-detail.test.tsx

      - name: Verify original failing shard
        run: pnpm --filter='@multica/views' exec vitest run --shard=1/2
