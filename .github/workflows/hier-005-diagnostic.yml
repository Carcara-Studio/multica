name: HIER-005 Diagnostic

on:
  push:
    branches:
      - feat/HIER-005-project-hierarchy-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hier-005-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolate-project-detail-and-verify:
    name: isolate ProjectDetail child and verify views shard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Isolate hierarchy child in ProjectDetail tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("packages/views/projects/components/project-detail.test.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace('  queryOptions: <T,>(options: T) => options,\n', '', 1)
          anchor = 'vi.mock("../../workflows/project-workflow-menu", () => ({ ProjectWorkflowMenu: () => null }));\n'
          child_mock = '\nvi.mock("./project-hierarchy-section", () => ({\n  ProjectHierarchySection: () => null,\n}));\n'
          if child_mock.strip() not in text:
              if anchor not in text:
                  raise SystemExit("ProjectWorkflowMenu mock anchor not found")
              text = text.replace(anchor, anchor + child_mock, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit test isolation when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No test-isolation changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packages/views/projects/components/project-detail.test.tsx
            git commit -m 'HIER-005: isolate hierarchy from ProjectDetail unit tests'
            git push origin HEAD:feat/HIER-005-project-hierarchy-ui
          fi

      - name: Verify locale parity
        run: pnpm --filter='@multica/views' exec vitest run locales/parity.test.ts

      - name: Verify ProjectDetail regressions
        run: pnpm --filter='@multica/views' exec vitest run projects/components/project-detail.test.tsx

      - name: Verify original failing shard
        run: pnpm --filter='@multica/views' exec vitest run --shard=1/2
